[package]
name = "intercept-policy-guardrail"
version = "0.1.0"
edition = "2021"
description = "Zero-trust NEAR Policy Guardrail contract for Intercept cross-chain Kamino liquidation defense"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }
borsh = { version = "1.5.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
